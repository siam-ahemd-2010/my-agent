<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #FFF5F2 0%, #FFEBE5 50%, #FFD6CB 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(255, 107, 0, 0.08);
        }
        .orange-gradient-btn {
            background: linear-gradient(135deg, #FF6B00 0%, #FF8800 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }
        .orange-gradient-btn:hover {
            background: linear-gradient(135deg, #E56000 0%, #E57A00 100%);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="glass-card rounded-3xl p-6 text-center">
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">AI Agent Management Hub</h1>
            <p class="text-sm text-gray-600 mt-1">Multi-Tenant Facebook Automation Manager</p>
        </div>

        <!-- Add New Client -->
        <div class="glass-card rounded-3xl p-6 md:p-8 space-y-5">
            <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-orange-500 inline-block"></span>
                Add New Client Integration
            </h2>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Facebook Page Access Token (Inbox)</label>
                <input type="text" id="access_token" placeholder="EAA..." class="w-full px-4 py-3 rounded-2xl bg-white/70 border border-white/80 focus:outline-none focus:ring-2 focus:ring-orange-500/50 text-gray-800 text-sm shadow-inner">
            </div>

            <!-- New Input Field for Comment Access Token -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Comment Access Token (Optional / Same as Page Token)</label>
                <input type="text" id="comment_access_token" placeholder="EAA... (If empty, uses Page Access Token)" class="w-full px-4 py-3 rounded-2xl bg-white/70 border border-white/80 focus:outline-none focus:ring-2 focus:ring-orange-500/50 text-gray-800 text-sm shadow-inner">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">System Prompt</label>
                <textarea id="system_prompt" rows="3" placeholder="You are an AI Assistant..." class="w-full px-4 py-3 rounded-2xl bg-white/70 border border-white/80 focus:outline-none focus:ring-2 focus:ring-orange-500/50 text-gray-800 text-sm shadow-inner"></textarea>
            </div>

            <button onclick="addClient()" class="w-full orange-gradient-btn text-white font-semibold py-3.5 px-6 rounded-2xl transition duration-200">
                Deploy Agent Integration
            </button>
        </div>

        <!-- Active Clients List -->
        <div class="glass-card rounded-3xl p-6 md:p-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-orange-500 inline-block"></span>
                Configured Client Agent Links
            </h2>

            <div id="clients-list" class="space-y-4">
                <!-- Dynamic Loaded Content -->
            </div>
        </div>

    </div>

    <script>
        async function loadClients() {
            const res = await fetch('/api/clients');
            const data = await res.json();
            const listDiv = document.getElementById('clients-list');
            listDiv.innerHTML = '';

            if (data.clients.length === 0) {
                listDiv.innerHTML = `<p class="text-sm text-gray-500 text-center py-4">No client agents configured yet.</p>`;
                return;
            }

            data.clients.forEach(client => {
                const clientDashboardUrl = `${window.location.origin}/dashboard/${client.page_id}`;
                const card = `
                    <div class="glass-card rounded-2xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 transition hover:shadow-lg">
                        <div class="space-y-1">
                            <h3 class="font-bold text-lg text-gray-900">${client.page_name || 'Facebook Page'}</h3>
                            <p class="text-xs text-gray-500 font-mono">Page ID: ${client.page_id}</p>
                            <div class="flex items-center gap-2 mt-2">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${client.is_active ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                                    ${client.is_active ? '● Active' : '○ Inactive'}
                                </span>
                            </div>
                        </div>

                        <!-- Dedicated Client Share Link & Actions -->
                        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                            <input type="text" readonly value="${clientDashboardUrl}" class="px-3 py-2 text-xs bg-white/80 border border-white rounded-xl text-gray-600 font-mono select-all focus:outline-none">
                            <button onclick="copyToClipboard('${clientDashboardUrl}')" class="px-4 py-2 bg-white/90 hover:bg-white text-orange-600 font-semibold text-xs rounded-xl border border-orange-200 transition">
                                Copy Link
                            </button>
                            <a href="/dashboard/${client.page_id}" target="_blank" class="px-4 py-2 orange-gradient-btn text-white font-semibold text-xs rounded-xl text-center">
                                Open Dashboard ↗
                            </a>
                            <button onclick="deleteClient('${client.page_id}', '${client.page_name || 'this page'}')" class="px-4 py-2 bg-rose-500/10 hover:bg-rose-500 hover:text-white text-rose-600 font-semibold text-xs rounded-xl border border-rose-200 transition">
                                Delete
                            </button>
                        </div>
                    </div>
                `;
                listDiv.innerHTML += card;
            });
        }

        async function addClient() {
            const token = document.getElementById('access_token').value.trim();
            const commentToken = document.getElementById('comment_access_token').value.trim();
            const prompt = document.getElementById('system_prompt').value.trim();

            if (!token || !prompt) {
                alert("Please fill in Page Access Token and System Prompt!");
                return;
            }

            const res = await fetch('/api/clients/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    access_token: token, 
                    comment_access_token: commentToken || token,
                    system_prompt: prompt 
                })
            });

            const result = await res.json();
            if (result.success) {
                document.getElementById('access_token').value = '';
                document.getElementById('comment_access_token').value = '';
                document.getElementById('system_prompt').value = '';
                loadClients();
            } else {
                alert("Error: " + result.error);
            }
        }

        async function deleteClient(pageId, pageName) {
            if (confirm(`Are you sure you want to remove "${pageName}" (ID: ${pageId})?`)) {
                const res = await fetch('/api/clients/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_id: pageId })
                });

                const result = await res.json();
                if (result.success) {
                    loadClients();
                } else {
                    alert("Error: " + result.error);
                }
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert("Client Portal Link Copied to Clipboard!");
        }

        loadClients();
    </script>
</body>
</html>
