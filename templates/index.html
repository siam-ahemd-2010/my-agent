<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Messenger Automation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-white shadow-md rounded-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Messenger Bot Control Panel</h1>

        <!-- SETUP / EDIT FORM (Invisible after Start Automation) -->
        <div id="setup-form" class="space-y-4 border p-4 rounded-lg bg-gray-50">
            <h2 class="text-lg font-semibold text-gray-700">Add / Edit Client Settings</h2>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Facebook Page Access Token</label>
                <input type="text" id="access_token" placeholder="EAA..." class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">System Prompt</label>
                <textarea id="system_prompt" rows="3" placeholder="You are a helpful customer service assistant..." class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300"></textarea>
            </div>

            <button onclick="startAutomation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-md transition">
                Start Automation
            </button>
        </div>

        <!-- ACTIVE CLIENTS LIST (Invisible inputs, active toggles) -->
        <div class="mt-8">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Configured Pages & Automation Status</h2>
            <div id="clients-list" class="space-y-4">
                <!-- Dynamic client cards will load here -->
            </div>
        </div>
    </div>

    <script>
        async function loadClients() {
            const res = await fetch('/api/clients');
            const data = await res.json();
            const listDiv = document.getElementById('clients-list');
            listDiv.innerHTML = '';

            if (data.clients.length === 0) {
                listDiv.innerHTML = `<p class="text-sm text-gray-500">No active pages configured yet.</p>`;
                return;
            }

            data.clients.forEach(client => {
                const isChecked = client.is_active ? 'checked' : '';
                const card = `
                    <div class="flex items-center justify-between border p-4 rounded-lg bg-white shadow-sm">
                        <div>
                            <h3 class="font-bold text-gray-800">${client.page_name || 'Facebook Page'}</h3>
                            <p class="text-xs text-gray-500">Page ID: ${client.page_id}</p>
                            <p class="text-xs text-gray-600 mt-1 italic">Prompt: "${client.system_prompt.substring(0, 50)}..."</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-sm font-medium ${client.is_active ? 'text-green-600' : 'text-red-500'}">
                                ${client.is_active ? 'Active' : 'Inactive'}
                            </span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" ${isChecked} onchange="toggleAutomation('${client.page_id}', this.checked)" class="sr-only peer">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                            </label>
                        </div>
                    </div>
                `;
                listDiv.innerHTML += card;
            });
        }

        async function startAutomation() {
            const token = document.getElementById('access_token').value.trim();
            const prompt = document.getElementById('system_prompt').value.trim();

            if (!token || !prompt) {
                alert("Please fill in both Access Token and System Prompt!");
                return;
            }

            const res = await fetch('/api/clients/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_token: token, system_prompt: prompt })
            });

            const result = await res.json();
            if (result.success) {
                // Clear and Hide Inputs
                document.getElementById('access_token').value = '';
                document.getElementById('system_prompt').value = '';
                
                // Reload client list
                loadClients();
            } else {
                alert("Error: " + result.error);
            }
        }

        async function toggleAutomation(pageId, isActive) {
            await fetch('/api/clients/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ page_id: pageId, is_active: isActive })
            });
            loadClients();
        }

        // Initial Load
        loadClients();
    </script>
</body>
</html>
