<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #FFF5F2 0%, #FFEBE5 50%, #FFD6CB 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(255, 107, 0, 0.08);
        }
        .orange-gradient-btn {
            background: linear-gradient(135deg, #FF6B00 0%, #FF8800 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">
    <div class="max-w-xl w-full glass-card rounded-3xl p-6 md:p-8 space-y-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-orange-100 pb-4">
            <div>
                <h1 id="page_name" class="text-2xl font-bold text-gray-900">Loading Page...</h1>
                <p id="page_id_text" class="text-xs text-gray-500 font-mono mt-0.5">Page ID: {{ page_id }}</p>
            </div>
            <!-- iOS Toggle -->
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="toggle_status" onchange="toggleStatus(this.checked)" class="sr-only peer">
                <div class="w-14 h-8 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-7 after:w-7 after:transition-all peer-checked:bg-orange-500"></div>
            </label>
        </div>

        <!-- Status Indicator -->
        <div id="status_badge" class="p-3 rounded-2xl text-center font-medium text-sm">
            Checking status...
        </div>

        <!-- System Prompt Customization -->
        <div class="space-y-3">
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">AI System Prompt Instructions</label>
            <textarea id="system_prompt" rows="5" class="w-full px-4 py-3 rounded-2xl bg-white/70 border border-white/80 focus:outline-none focus:ring-2 focus:ring-orange-500/50 text-gray-800 text-sm shadow-inner"></textarea>
            <button onclick="savePrompt()" class="w-full orange-gradient-btn text-white font-semibold py-3 rounded-2xl transition">
                Update AI Behavior
            </button>
        </div>

    </div>

    <script>
        const pageId = "{{ page_id }}";

        async function loadClientData() {
            const res = await fetch(`/api/clients/${pageId}`);
            const data = await res.json();
            
            if (data.success) {
                const client = data.client;
                document.getElementById('page_name').innerText = client.page_name;
                document.getElementById('system_prompt').value = client.system_prompt;
                document.getElementById('toggle_status').checked = client.is_active;

                updateStatusUI(client.is_active);
            } else {
                alert("Invalid or inactive Page Dashboard link.");
            }
        }

        function updateStatusUI(isActive) {
            const badge = document.getElementById('status_badge');
            if (isActive) {
                badge.className = "p-3 rounded-2xl text-center font-semibold text-sm bg-emerald-100 text-emerald-800 border border-emerald-200";
                badge.innerText = "● AI Messenger Automation is ACTIVE";
            } else {
                badge.className = "p-3 rounded-2xl text-center font-semibold text-sm bg-rose-100 text-rose-800 border border-rose-200";
                badge.innerText = "○ AI Messenger Automation is PAUSED";
            }
        }

        async function toggleStatus(isActive) {
            await fetch('/api/clients/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ page_id: pageId, is_active: isActive })
            });
            updateStatusUI(isActive);
        }

        async function savePrompt() {
            const prompt = document.getElementById('system_prompt').value.trim();
            const res = await fetch('/api/clients/update-prompt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ page_id: pageId, system_prompt: prompt })
            });
            const result = await res.json();
            if (result.success) {
                alert("AI Instructions updated successfully!");
            } else {
                alert("Failed to update instructions.");
            }
        }

        loadClientData();
    </script>
</body>
</html>
